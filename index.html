<style>
:root {
  --red: #DC2626;
  --red-dark: #991B1B;
  --red-glow: #EF4444;
  --silver: #C0C0C0;
  --dark: #0a0a0a;
  --card: #111111;
  --text: #e5e5e5;
  --muted: #888;
  --glass: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.1);
}

* {margin: 0; padding: 0; box-sizing: border-box;}
html {scroll-behavior: smooth; overflow-x: hidden;}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: var(--dark);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}

/* Gradient overlays */
.bg-radial {background: radial-gradient(ellipse at center, rgba(220,38,38,0.08) 0%, transparent 70%), var(--dark);}
.bg-maze {background: repeating-linear-gradient(45deg, var(--dark), var(--dark) 2px, var(--glass) 2px, var(--glass) 4px);}

/* NAVIGATION */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 60px;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  transition: all 0.3s ease;
}
nav.scrolled {background: rgba(10,10,10,0.98); box-shadow: 0 2px 20px rgba(0,0,0,0.3);}
nav .logo {
  font-size: 24px; font-weight: 900; color: var(--red); letter-spacing: 1.5px;
  transition: transform 0.3s;
}
nav .logo:hover {transform: translateY(-1px);}
nav .logo span {color: var(--silver); opacity: 0.7;}
nav ul {display: flex; gap: 40px; list-style: none;}
nav ul a {
  color: var(--text); text-decoration: none; font-size: 15px;
  text-transform: uppercase; letter-spacing: 1.2px; font-weight: 500;
  transition: all 0.3s; position: relative; padding: 8px 0;
}
nav ul a:hover {color: var(--red);}
nav ul a::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--red); transform: scaleX(0);
  transform-origin: right; transition: transform 0.3s;
}
nav ul a:hover::after {transform: scaleX(1); transform-origin: left;}

/* HERO */
.hero {
  min-height: 100vh; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center;
  padding: 0 20px; position: relative; overflow: hidden;
  background: var(--dark);
}
.hero::before {
  content: ''; position: absolute; top: -100px; right: -100px;
  width: 400px; height: 400px; background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
  filter: blur(80px); animation: pulse 8s ease-in-out infinite;
}
.hero::after {
  content: ''; position: absolute; bottom: -100px; left: -100px;
  width: 400px; height: 400px; background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
  filter: blur(80px); animation: pulse 8s ease-in-out infinite;
  opacity: 0.5;
}
@keyframes pulse {
  0%, 100% {transform: scale(1); opacity: 0.5;}
  50% {transform: scale(1.2); opacity: 0.8;}
}
.hero h1 {
  font-size: clamp(48px, 8vw, 96px); font-weight: 900;
  line-height: 1.1; margin-bottom: 30px; position: relative;
  background: linear-gradient(135deg, #fff 0%, var(--silver) 50%, var(--red) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: -1px;
}
.hero p {
  font-size: clamp(20px, 4vw, 24px); color: var(--muted);
  max-width: 700px; margin-bottom: 50px; position: relative;
  font-weight: 400;
}
.hero p::before {
  content: ''; position: absolute; top: 50%; left: -40px;
  transform: translateY(-50%); width: 20px; height: 2px; background: var(--red);
}
.hero .cta-group {
  display: flex; gap: 20px; flex-wrap: wrap;
  margin-top: 30px;
}
.btn {
  display: inline-block; padding: 16px 48px; border-radius: 50px;
  font-size: 16px; font-weight: 700; text-decoration: none;
  text-transform: uppercase; letter-spacing: 1.5px; transition: all 0.3s;
  position: relative; cursor: pointer; border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  overflow: hidden;
}
.btn-primary {
  background: var(--red); color: white;
  box-shadow: 0 8px 30px rgba(220,38,38,0.4);
}
.btn-primary:hover {
  background: var(--red-glow);
  box-shadow: 0 12px 40px rgba(220,38,38,0.6);
  transform: translateY(-3px);
}
.btn-primary::before {
  content: ''; position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transition: left 0.5s;
}
.btn-primary:hover::before {left: 100%;}
.btn-outline {
  border: 2px solid var(--red); color: var(--red);
  background: rgba(10,10,10,0.5);
  backdrop-filter: blur(10px);
}
.btn-outline:hover {
  background: var(--red);
  color: white;
  box-shadow: 0 8px 30px rgba(220,38,38,0.4);
  transform: translateY(-3px);
}

/* SECTIONS */
section {padding: 120px 60px; position: relative; overflow: hidden;}
section::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-maze); opacity: 0.3; pointer-events: none;
}
.section-title {text-align: center; margin-bottom: 80px; position: relative; z-index: 1;}
.section-title h2 {font-size: 48px; font-weight: 900; margin-bottom: 16px; line-height: 1.1;}
.section-title h2 span {color: var(--red);}
.section-title p {color: var(--muted); font-size: 18px; font-weight: 400;}
.section-title::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 60px; height: 4px; background: var(--red); border-radius: 2px;
}

/* SERVICES */
.services {background: var(--card); border-radius: 24px; margin: -40px 0 0 -40px;}
.services-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 32px; max-width: 1200px; margin: 0 auto;
}
.service-card {
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 48px 36px;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}
.service-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.service-card:hover::before {opacity: 1;}
.service-card:hover {
  border-color: var(--red);
  transform: translateY(-8px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.service-card .icon {
  font-size: 56px; margin-bottom: 24px; filter: drop-shadow(0 4px 8px rgba(220,38,38,0.3));
}
.service-card h3 {font-size: 24px; margin-bottom: 14px; font-weight: 700;}
.service-card p {color: var(--muted); line-height: 1.7; margin-bottom: 20px; font-weight: 400;}
.service-card .price {
  color: var(--red); font-weight: 800; font-size: 20px;
  background: rgba(220,38,38,0.1); padding: 6px 14px;
  border-radius: 8px; display: inline-block;
}

/* GALLERY */
.gallery {background: var(--dark);}
.gallery-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 32px; max-width: 1200px; margin: 0 auto;
}
.gallery-item {
  position: relative; border-radius: 20px; overflow: hidden;
  aspect-ratio: 4/3; background: var(--card);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: all 0.4s ease;
  border: 1px solid var(--border);
}
.gallery-item:hover {transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.5);}
.gallery-item img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.6s;
}
.gallery-item:hover img {transform: scale(1.08);}

/* PROCESS */
.process {background: var(--card); border-radius: 24px; margin: -60px 0 0 -60px;}
.process-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 40px; max-width: 1000px; margin: 0 auto; text-align: center;
  position: relative; z-index: 1;
}
.process-indicator {
  position: absolute; top: 50%; left: 0; right: 0; height: 2px;
  background: var(--border); transform: translateY(-50%);
}
.process-indicator::before {
  content: ''; position: absolute; top: 0; left: 20px; right: 20px;
  height: 2px; background: var(--red);
}
.process-step {
  position: relative; z-index: 1;
  transition: transform 0.3s;
}
.process-step:hover {transform: translateY(-5px);}
.process-step .num {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--red); color: white; font-size: 28px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px;
  box-shadow: 0 8px 20px rgba(220,38,38,0.4);
  transition: all 0.3s;
}
.process-step:hover .num {transform: scale(1.1); box-shadow: 0 12px 30px rgba(220,38,38,0.6);}
.process-step h4 {font-size: 20px; margin-bottom: 10px; font-weight: 600;}
.process-step p {color: var(--muted); font-size: 15px; font-weight: 400;}

/* TESTIMONIALS */
.testimonials {background: var(--dark);}
.testimonial-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 28px; max-width: 1100px; margin: 0 auto;
}
.testimonial-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 40px;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.testimonial-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  opacity: 0; transition: opacity 0.3s;
}
.testimonial-card:hover::before {opacity: 0.5;}
.testimonial-card:hover {transform: translateY(-6px); box-shadow: 0 15px 35px rgba(0,0,0,0.4);}
.testimonial-card .stars {
  color: #F59E0B; font-size: 20px; margin-bottom: 18px;
  letter-spacing: 1px;
}
.testimonial-card p {
  font-style: italic; line-height: 1.8; margin-bottom: 18px; color: var(--text);
  font-size: 16px;
}
.testimonial-card .author {
  display: flex; align-items: center; gap: 14px;
}
.testimonial-card .avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--red); display: flex; align-items: center;
  justify-content: center; font-weight: 800; font-size: 20px;
  box-shadow: 0 4px 15px rgba(220,38,38,0.3);
}
.testimonial-card .author-name {font-weight: 700; font-size: 16px;}
.testimonial-card .author-loc {color: var(--muted); font-size: 14px;}

/* CONTACT */
.contact {background: var(--card); border-radius: 24px; margin: -60px 0 0 -60px;}
.contact-container {
  max-width: 900px; margin: 0 auto; text-align: center;
  position: relative; z-index: 1;
}
.social-tabs {
  display: flex; justify-content: center; gap: 20px;
  flex-wrap: wrap; margin-top: 50px;
}
.social-tab {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 28px; border-radius: 16px;
  text-decoration: none; color: white; font-weight: 600;
  transition: all 0.3s; border: 1px solid var(--border);
  font-size: 16px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.social-tab:hover {
  transform: translateY(-4px);
  border-color: transparent;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}
.social-tab svg {width: 28px; height: 28px;}
.social-tab.whatsapp {background: rgba(37,211,102,0.15);}
.social-tab.whatsapp:hover {background: #25D366; box-shadow: 0 8px 25px rgba(37,211,102,0.4);}
.social-tab.tiktok {background: rgba(255,255,255,0.05);}
.social-tab.tiktok:hover {background: #010101; box-shadow: 0 8px 25px rgba(255,255,255,0.15); border-color: #FF0050;}
.social-tab.facebook {background: rgba(24,119,242,0.15);}
.social-tab.facebook:hover {background: #1877F2; box-shadow: 0 8px 25px rgba(24,119,242,0.4);}
.social-tab.email {background: rgba(234,67,53,0.15);}
.social-tab.email:hover {background: #EA4335; box-shadow: 0 8px 25px rgba(234,67,53,0.4);}
.social-tab.instagram {background: rgba(228,64,95,0.15);}
.social-tab.instagram:hover {background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); box-shadow: 0 8px 25px rgba(228,64,95,0.4);}

/* MAP */
.map-section {background: var(--dark); padding: 0; position: relative; overflow: hidden;}
.map-section::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 200px; background: linear-gradient(to bottom, var(--dark), transparent);
  z-index: 0;
}
.map-container {
  max-width: 1200px; margin: 0 auto; padding: 0 60px 100px;
  position: relative; z-index: 1;
}
.map-frame {
  width: 100%; height: 400px; border-radius: 20px;
  border: 1px solid var(--border); overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  transition: transform 0.3s;
}
.map-frame:hover {transform: translateY(-5px);}
.map-frame iframe {width: 100%; height: 100%; border: none;}
.map-info {
  text-align: center; margin-top: 24px;
  padding: 20px; background: var(--card);
  border-radius: 16px; border: 1px solid var(--border);
}
.map-info h4 {color: var(--text); margin-bottom: 8px; font-size: 18px;}
.map-info p {color: var(--muted); font-size: 15px;}

/* FOOTER */
footer {
  background: var(--dark); padding: 60px 60px 40px;
  text-align: center; border-top: 1px solid var(--border);
  position: relative; overflow: hidden;
}
footer::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 1px; background: linear-gradient(90deg, transparent, var(--red), transparent);
}
footer p {color: var(--muted); font-size: 14px;}
footer .portfolio-link {
  color: var(--red); text-decoration: none; font-weight: 600;
  transition: color 0.3s;
}
footer .portfolio-link:hover {
  color: var(--red-glow); text-decoration: underline;
}

/* WEB DESIGNER SECTION */
.webdesigner {background: var(--dark);}
.wd-container {max-width: 800px; margin: 0 auto; position: relative; z-index: 1;}
.wd-card {
  display: flex; gap: 36px; align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px; padding: 56px;
  backdrop-filter: blur(10px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  transition: all 0.3s;
}
.wd-card:hover {transform: translateY(-8px); box-shadow: 0 25px 60px rgba(0,0,0,0.5);}
.wd-avatar {
  width: 100px; height: 100px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--red), var(--red-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: 900; color: white;
  box-shadow: 0 8px 25px rgba(220,38,38,0.4);
}
.wd-info h3 {font-size: 32px; margin-bottom: 8px; font-weight: 800;}
.wd-info h3 span {color: var(--red);}
.wd-role {
  color: var(--red); font-weight: 600; margin-bottom: 16px;
  font-size: 16px; letter-spacing: 1px;
}
.wd-desc {color: var(--muted); line-height: 1.7; margin-bottom: 24px; font-size: 16px;}
.wd-desc strong {color: var(--text);}
.wd-stats {
  display: flex; gap: 28px; margin-bottom: 20px; flex-wrap: wrap;
}
.wd-stat {text-align: center; flex: 1; min-width: 120px;}
.wd-stat-num {
  display: block; font-size: 24px; font-weight: 800; color: var(--red);
  letter-spacing: -0.5px;
}
.wd-stat-label {font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;}
.wd-skills {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
}
.wd-skill {
  padding: 6px 16px; border-radius: 20px; font-size: 14px;
  background: rgba(220,38,38,0.15); color: var(--red);
  border: 1px solid rgba(220,38,38,0.25);
  font-weight: 600;
  transition: all 0.2s;
}
.wd-skill:hover {
  background: var(--red); color: white;
  transform: scale(1.05);
}

/* ANIMATIONS */
.fade-in {
  opacity: 0; transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.fade-in.visible {opacity: 1; transform: translateY(0);}

/* STAGGERED ANIMATIONS */
.stagger-1 {transition-delay: 0.1s;}
.stagger-2 {transition-delay: 0.2s;}
.stagger-3 {transition-delay: 0.3s;}
.stagger-4 {transition-delay: 0.4s;}
.stagger-5 {transition-delay: 0.5s;}
.stagger-6 {transition-delay: 0.6s;}

/* PARALLAX BACKGROUND */
.parallax {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1; opacity: 0.3;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  nav {padding: 14px 20px;}
  nav ul {display: none;}
  section {padding: 80px 20px;}
  .hero h1 {font-size: 42px; letter-spacing: -0.5px;}
  .hero p {font-size: 18px;}
  .hero .cta-group {gap: 12px;}
  .btn {padding: 14px 36px; font-size: 14px;}
  .section-title h2 {font-size: 38px;}
  .services-grid {gap: 28px;}
  .service-card {padding: 40px 28px;}
  .gallery-grid {gap: 28px;}
  .process-grid {gap: 30px;}
  .testimonial-grid {gap: 24px;}
  .testimonial-card {padding: 32px 24px;}
  .social-tabs {gap: 12px; margin-top: 30px;}

  .social-tab svg {width: 22px; height: 22px;}
  .map-container {padding: 0 20px 60px;}
  .wd-card {flex-direction: column; text-align: center; padding: 40px 28px;}
  .wd-stats {gap: 20px; justify-content: center;}
  .wd-stat {min-width: 80px;}
  .wd-skills {justify-content: center;}
  footer {padding: 40px 20px;}
}

@media (max-width: 480px) {

/* ===================== GALLERY LIGHTBOX ===================== */
#gallery-lightbox {

  background: rgba(0,0,0,0.92);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;

#lightbox-img {

  cursor: pointer; display: flex; align-items: center; justify-content: center;

.lightbox-caption {

<script>
// Scroll reveal with staggered animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, {threshold: 0.1});

document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

// Navbar scroll effect
window.addEventListener('scroll', () => {
  const navbar = document.getElementById('navbar');
  if (window.scrollY > 50) {
    navbar.classList.add('scrolled');
  } else {
    navbar.classList.remove('scrolled');
  }
});

// Smooth scroll for anchor links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function(e) {
    const target = document.querySelector(this.getAttribute('href'));
    if (target) {
      e.preventDefault();
      target.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  });
});

// ===================== GALLERY LIGHTBOX (pop-up on flyers) =====================
(function() {
  const overlay = document.createElement('div');
  overlay.id = 'gallery-lightbox';
  overlay.innerHTML = `
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" src="" alt="Flyer full size">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  `;
  document.body.appendChild(overlay);

  const img = overlay.querySelector('#lightbox-img');
  const caption = overlay.querySelector('#lightbox-caption');

  document.querySelectorAll('.gallery-item[data-full]').forEach(item => {
    item.addEventListener('click', () => {
      const src = item.getAttribute('data-full') || item.querySelector('img').getAttribute('src') || '';
      img.src = src;
      caption.textContent = item.querySelector('img').getAttribute('alt') || '';
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      img.onclick = () => close();
    });
  });

  function close() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    img.src = '';
    img.onclick = null;
  }

  overlay.querySelector('#lightbox-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) close();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
  });
})();
</script>
